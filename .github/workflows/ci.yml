name: ci

# Three gates. `knowledge` is the corpus as a build input. `ddl` runs the isolation contract on a
# real Postgres and reads its security claims back. `app` is guarded: it skips until code exists, so
# a red-from-birth check never teaches anyone to ignore CI. It becomes required in branch protection
# at M1, not before.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.check.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f package.json ] || ls apps/*/package.json >/dev/null 2>&1; then
            echo 'app=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::No application code yet (pre-M1): skipping app gates'
            echo 'app=false' >> "$GITHUB_OUTPUT"
          fi

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: No personal absolute paths in the tooling
        shell: pwsh
        run: |
          # The corpus audit once hardcoded the laptop it was written on and passed locally,
          # failed on the runner. A tool that knows where the repository is cannot fail that way.
          $hits = Get-ChildItem -Path tools -Recurse -File | Select-String -Pattern 'C:\\Users[\\/]|/home/[a-z]'
          if ($hits) { $hits | ForEach-Object { "::error file=$($_.Path) line=$($_.LineNumber)::hardcoded personal path: $($_.Line.Trim())" }; exit 1 }
          'Tooling paths are relative to the repository.'

      - name: Corpus integrity (anchors, yaml files, source ids, dead links)
        shell: pwsh
        run: |
          $out = & ./tools/audit-links.ps1 | Tee-Object -FilePath audit.txt
          $text = $out -join "`n"
          $bad = @()
          foreach ($k in 'MISSING ANCHORS', 'MISSING YAML FILES', 'BAD SOURCE IDS', 'DEAD LINKS', 'UNTRACKED TARGETS', 'UNCOMMITTED CORPUS FILES') {
            if ($text -match "$k`:\s*(\d+)") {
              if ([int]$Matches[1] -ne 0) { $bad += "$k = $($Matches[1])" }
            } else { $bad += "$k not reported by the audit" }
          }
          if ($bad) { $bad | ForEach-Object { "::error::$_" }; exit 1 }
          'Corpus audit clean.'

      - name: Contracts and fixtures parse
        shell: pwsh
        run: |
          $strict = New-Object System.Text.UTF8Encoding($false, $true)
          $fail = 0
          Get-ChildItem -Path . -Recurse -Include *.json -File | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            $name = $_.FullName
            try {
              $bytes = [System.IO.File]::ReadAllBytes($name)
              $strict.GetString($bytes) | ConvertFrom-Json | Out-Null
            } catch { "::error::${name}: $($_.Exception.Message)"; $fail = 1 }
          }
          exit $fail

      - name: Contract shape (casing, ids, documentation ratchet, completeness)
        shell: pwsh
        run: |
          # The contracts are the only place a shape is written down, so a convention that lives only
          # in prose quietly splits into two conventions. Two of five files had already done that.
          $out = & ./tools/check-contracts.ps1 | Tee-Object -FilePath contracts.txt
          $text = $out -join "`n"
          $bad = @()
          foreach ($k in 'PARSE FAILURES', 'MISSING METADATA', 'BAD ID PATHS', 'SNAKE_CASE PROPERTIES', 'SNAKE_CASE ENUM VALUES', 'PENDING CONTRACT FILES') {
            if ($text -match "$k`:\s*(\d+)") {
              if ([int]$Matches[1] -ne 0) { $bad += "$k = $($Matches[1])" }
            } else { $bad += "$k not reported by the checker" }
          }
          $undoc = -1
          $budget = -1
          if ($text -match 'UNDOCUMENTED PROPERTIES:\s*(\d+)') { $undoc = [int]$Matches[1] }
          if ($text -match 'UNDOCUMENTED BUDGET:\s*(\d+)') { $budget = [int]$Matches[1] }
          if ($undoc -lt 0 -or $budget -lt 0) {
            $bad += 'the documentation ratchet is not being reported'
          } elseif ($undoc -gt $budget) {
            $bad += "undocumented properties $undoc > budget $budget"
          } elseif ($undoc -lt $budget) {
            "::notice::undocumented properties down to $undoc; lower the budget in tools/check-contracts.ps1"
          }
          if ($bad) { $bad | ForEach-Object { "::error::$_" }; exit 1 }
          'Contract shape gate clean.'

      - name: Vocabulary agreement (one list, every declaration)
        shell: pwsh
        run: |
          # A vocabulary declared in four places is four chances to disagree, and the disagreement
          # stays invisible until a CHECK rejects a row that a rule just fired. This compares the
          # declarations pairwise - change kinds across the contract and the DDL, tiers across
          # knowledge, both DDL CHECKs and the wire enum - and fails on a mismatch or on a renamed
          # constraint (a checker that cannot tell "equal" from "not found" is not a checker).
          $out = & ./tools/check-vocabulary.ps1 | Tee-Object -FilePath vocabulary.txt
          $text = $out -join "`n"
          if ($text -notmatch 'RESULT: OK') {
            "::error::vocabulary declarations disagree, or the checker did not report a result"
            exit 1
          }
          'Vocabulary gate clean.'

      - name: Heuristics are valid YAML with range + confidence + sources
        continue-on-error: false
        run: |
          python3 - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except Exception:
              print('::notice::PyYAML unavailable, knob-shape check skipped'); sys.exit(0)
          bad = 0
          for p in sorted(pathlib.Path('knowledge/heuristics').glob('*.yaml')):
              try:
                  data = yaml.safe_load(p.read_text(encoding='utf-8'))
              except Exception as e:
                  print(f'::error file={p}::{e}'); bad = 1; continue
              text = p.read_text(encoding='utf-8')
              if 'confidence' not in text or 'provenance' not in text:
                  print(f'::error file={p}::knob file lacks confidence or provenance'); bad = 1
          sys.exit(bad)
          PY

      - name: Accepted ADRs are never edited
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $files = git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- docs/adr/
          $bad = 0
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { continue }
            $head = (Get-Content $f -Raw -Encoding utf8)
            if ($head -match '(?m)^status:\s*(accepted|superseded)') { "::error::${f}: accepted ADR edited - supersede it with a new ADR"; $bad = 1 }
          }
          exit $bad

  ddl:
    # This DDL is the isolation contract (ADR-0002), and "it loads" proves almost nothing about it:
    # both purge bugs this file has already carried were silent successes -- a DELETE that matched no
    # rows while reporting success. So the file runs on a real Postgres 16 twice. Once inside a
    # transaction that is rolled back, which is also where its own leak test runs; once for real, so
    # the security claims can be read back out of the catalog instead of asserted in prose.
    runs-on: ubuntu-latest
    defaults:
      run: { shell: bash }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v7

      - name: Record the server this gate ran against
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do pg_isready -q && break; sleep 2; done
          pg_isready
          psql -q -At -c "select 'Postgres ' || current_setting('server_version')"
          # Printed because row-security behaviour is what is under test: a gate that does not name
          # its server is a gate nobody can reproduce three years from now.

      - name: Apply inside a transaction, then roll it back
        run: |
          set -euo pipefail
          # schema.sql contains no BEGIN/COMMIT of its own, so the transaction is spelled here. Note
          # that `psql -1` would NOT be equivalent: without an explicit rollback it commits, and this
          # pass exists precisely to show the file can be applied to a database that must not change.
          cat > /tmp/wrapped.sql <<'SQL'
          begin;
          \i schemas/sql/schema.sql
          rollback;
          SQL
          # The last statement of schema.sql is its own LEAK TEST. If it ever goes blind it raises
          # "leak test is blind"; silence in this log is the assertion, so the log is shown.
          psql -q -t -A -v ON_ERROR_STOP=1 -f /tmp/wrapped.sql > /tmp/apply.log 2>&1 \
            || { sed -n '1,200p' /tmp/apply.log; exit 1; }
          # The policy factory returns one row per table, so the log is mostly blank lines.
          grep -Ev '^[[:space:]]*$' /tmp/apply.log || true

      - name: Prove the rolled-back pass persisted nothing
        run: |
          set -euo pipefail
          objs=$(psql -q -At -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname in ('public','app','analytics') and c.relkind in ('r','v')")
          roles=$(psql -q -At -c "select count(*) from pg_roles where rolname in ('app_user','worker','analytics_reader','purger')")
          if [ "$objs" != 0 ] || [ "$roles" != 0 ]; then
            echo "::error::the rolled-back pass left $objs relations and $roles roles behind"
            exit 1
          fi
          echo "rolled back clean: $objs relations, $roles roles"

      - name: Apply for real and read the security claims back
        run: |
          set -euo pipefail
          psql -q -1 -v ON_ERROR_STOP=1 -f schemas/sql/schema.sql > /tmp/apply2.log 2>&1 \
            || { sed -n '1,200p' /tmp/apply2.log; exit 1; }
          grep -E 'NOTICE|ERROR' /tmp/apply2.log || true
          # Everything above says the file loads. This is the part that says ADR-0002 is true of it:
          # FORCE on every tenant table, one named exempt table, no application role with BYPASSRLS,
          # purge visibility, no user_id through analytics, append-only guards still attached.
          psql -q -v ON_ERROR_STOP=1 -f tools/check-claims.sql

  app:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Golden plans
        run: pnpm test:golden
      - name: Catalogue parity en vs zh-Hant
        run: node tools/check-i18n-parity.mjs
      - name: Narrator never invents a number or crosses a banned topic
        run: pnpm test -- narrator

schema_version: 1
id: wellness
status: draft
owner: phys-agent
last_reviewed: 2026-11-03
provenance:
  docs: [knowledge/signals-and-metrics/hrv-and-wellness.md, knowledge/feedback-and-autoregulation/daily-feedback-taxonomy.md]
  sources: [PHYS-S19, FB-S1]
applies_to: [all]
extends: readiness

notes: >
  The wellness instrument is the **most trustworthy signal in the product** and the only one available to a
  runner with no device: four questions, answered in seconds, compared to the person's own average. It is
  deliberately not a mood diary — the items are the ones that move with training load and with illness, and
  they are the ones a runner can answer honestly on a bad day
  ([../feedback-and-autoregulation/daily-feedback-taxonomy.md](../feedback-and-autoregulation/daily-feedback-taxonomy.md)).
  `last_reviewed` above is a placeholder error; see the fix note at the bottom of this file.

knobs:
  instrument:
    value: {items: [sleep_quality, muscle_soreness, fatigue, stress], scale: 1-5, aggregate: mean}
    range: {items: 4, scale: [1-5, 0-10], aggregate: [mean, sum]}
    unit: object
    confidence: medium
    rationale: "Four items keeps entry under 15 s (entry_seconds_p90 in feedback-loop-metrics.md); more items buy noise, not information."
    persona_overridable: false
  min_confirmations:
    value: 2
    range: [1, 3]
    unit: days
    confidence: medium
    rationale: "Two low days is a pattern; one is a bad day. A red-flag symptom bypasses this via safety-hard-stops.yaml."
    persona_overridable: false
  downgrade_magnitude_pct:
    value: 20
    range: [10, 40]
    unit: percent-of-planned-load
    confidence: medium
    rationale: "A wellness-driven edit is a trim, not a cancellation: it preserves the shape of the week (template-may-shrink-not-squeeze)."
    persona_overridable: true
  wellness_only_downgrade_allowed:
    value: true
    range: null
    unit: bool
    confidence: high
    rationale: "No device must be required to get help from this system — the device cohort is a minority of runners and the wellness signal is the stronger one anyway."
    persona_overridable: false
  reference_window_days:
    value: 28
    range: [14, 60]
    unit: days
    confidence: medium
    rationale: "Same window as individual-baselines.yaml#baseline_window_days, so 'tired' means tired for this runner over the same span load is judged on."
    persona_overridable: true

rules:
  - id: wellness-questions-are-not-graded
    when: "a runner answers honestly, including 'bad' answers"
    then: "no_comment_that_judges_the_answer; no streak-shaming; no 'try to sleep more' instruction"
    severity: hard-stop
    explain: "wellness-no-shame"

  - id: illness-is-not-training-load
    when: "fever, chest symptoms, or symptoms below the neck"
    then: "subtract_and_refer; do not treat illness as a wellness score"
    severity: hard-stop
    explain: "wellness-illness-refers"
    note: "The illness gate lives in recovery.yaml#return_from_illness and safety-hard-stops.yaml."
